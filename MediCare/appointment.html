
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Appointment | MediCare Connect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #087f8c;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #087f8c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #06636d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087f8c;
            text-decoration: none;
        }

        .dashboard-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
        }

        .dashboard-btn:hover {
            background: #0056b3;
        }

        #appointmentMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<a href="user-dashboard.html" class="dashboard-btn">
    🏠 Dashboard
</a>

<div class="container">

    <h1>Request Appointment</h1>

    <p style="text-align:center;">
        Book your appointment with MediCare Connect
    </p>

    <form id="appointmentForm">

        <label>Full Name <span style="color:red;">*</span></label>
        <input type="text" name="name"
               placeholder="Enter your full name" required>

        <label>Phone Number <span style="color:red;">*</span></label>
        <input type="tel" name="phone"
               placeholder="Enter phone number"
               pattern="[0-9]{10}"
               maxlength="10" required>

        <label>Email</label>
        <input type="email" name="email"
               placeholder="Enter your email">

        <label>Appointment Date <span style="color:red;">*</span></label>
        <input type="date" id="date" name="date" required>

        <label>Appointment Time <span style="color:red;">*</span></label>
        <input type="time" name="time" required>

        <label>Service Required <span style="color:red;">*</span></label>
        <select name="service" required>
            <option value="">Select a service</option>
            <option>General Consultation</option>
            <option>Doctor Consultation</option>
            <option>Medicine Delivery</option>
            <option>Health Checkup</option>
            <option>Other</option>
        </select>

        <label>Additional Message</label>
        <textarea name="message" rows="4"
                  placeholder="Describe your requirements"></textarea>

        <button type="submit">Submit Appointment</button>

    </form>

    <p id="appointmentMessage"></p>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script>
    // Set minimum appointment date to today
    document.getElementById("date").min =
        new Date().toLocaleDateString("en-CA");

    // Submit and save appointment
    document.getElementById("appointmentForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const form = this;

            const formData = new FormData(form);

            // Create appointment object
            const appointment = {
                id: Date.now(),

                patientName: formData.get("name"),
                patientPhone: formData.get("phone"),
                patientEmail: formData.get("email"),

                date: formData.get("date"),
                time: formData.get("time"),

                doctor: formData.get("service"),
                reason: formData.get("message"),

                status: "Pending",

                createdAt: new Date().toISOString()
            };

            // Get existing appointments
            let appointments = JSON.parse(
                localStorage.getItem("medicare_appointments") || "[]"
            );

            // Add new appointment
            appointments.push(appointment);

            // Save to localStorage
            localStorage.setItem(
                "medicare_appointments",
                JSON.stringify(appointments)
            );

            // Show success message
            document.getElementById("appointmentMessage")
                .style.color = "green";

            document.getElementById("appointmentMessage")
                .textContent =
                "Appointment request submitted successfully!";

            // Reset form
            form.reset();
        });
</script>

</body>
</html>
