
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Blood Request | MediCare Connect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f5;
            padding: 30px 15px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #0001;
        }

        h1 {
            color: #087f8c;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #087f8c;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #087f8c;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #066873;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087f8c;
            text-decoration: none;
        }

        .dashboard-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
        }

        .dashboard-btn:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .note {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<!-- Dashboard button -->
<a href="user-dashboard.html" class="dashboard-btn">
    🏠 Dashboard
</a>

<div class="container">

    <h1>🚨 Emergency Blood Request</h1>

    <p class="description">
        Submit blood requirements for assistance through
        authorized blood banks.
    </p>

    <div class="note">
        <strong>Important:</strong> This is a demo request system.
        Submission does not guarantee blood availability.
        For emergencies, contact the hospital blood bank directly.
    </div>

    <form id="bloodRequestForm">

        <label for="patientName">Patient Name *</label>
        <input
            type="text"
            id="patientName"
            name="patientName"
            placeholder="Enter patient name"
            required>

        <label for="contactPerson">Contact Person *</label>
        <input
            type="text"
            id="contactPerson"
            name="contactPerson"
            placeholder="Enter contact person's name"
            required>

        <label for="phone">Contact Phone *</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="10-digit mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
            required>

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email address">

        <label for="bloodGroup">Required Blood Group *</label>
        <select id="bloodGroup" name="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
        </select>

        <label for="units">Units Required *</label>
        <input
            type="number"
            id="units"
            name="units"
            min="1"
            max="150"
            placeholder="Enter units required"
            required>

        <label for="hospital">Hospital Name *</label>
        <input
            type="text"
            id="hospital"
            name="hospital"
            placeholder="Enter hospital name"
            required>

        <label for="location">Hospital Location *</label>
        <textarea
            id="location"
            name="location"
            rows="3"
            placeholder="Enter hospital address and location"
            required></textarea>

        <label for="urgency">Urgency *</label>
        <select id="urgency" name="urgency" required>
            <option value="">Select Urgency</option>
            <option value="Immediate">Immediate</option>
            <option value="Within 24 Hours">Within 24 Hours</option>
            <option value="Within 2–3 Days">Within 2–3 Days</option>
        </select>

        <label for="requiredDate">Required Date *</label>
        <input
            type="date"
            id="requiredDate"
            name="requiredDate"
            required>

        <label for="notes">Additional Details</label>
        <textarea
            id="notes"
            name="notes"
            rows="3"
            placeholder="Any additional information"></textarea>

        <button type="submit">
            Submit Blood Request
        </button>

        <p id="message" role="status"></p>

    </form>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script>

    // Set minimum date to today
    const dateInput = document.getElementById("requiredDate");

    const today = new Date();

    const todayString = new Date(
        today.getTime() - today.getTimezoneOffset() * 60000
    ).toISOString().split("T")[0];

    dateInput.min = todayString;
    dateInput.value = todayString;


    // Submit emergency blood request
    document.getElementById("bloodRequestForm")
        .addEventListener("submit", function(event) {

        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);

        const request = {
            id: Date.now(),

            patientName: formData.get("patientName"),
            contactPerson: formData.get("contactPerson"),
            phone: formData.get("phone"),
            email: formData.get("email"),

            bloodGroup: formData.get("bloodGroup"),
            units: Number(formData.get("units")),

            hospital: formData.get("hospital"),
            location: formData.get("location"),

            urgency: formData.get("urgency"),
            requiredDate: formData.get("requiredDate"),

            notes: formData.get("notes"),

            status: "Pending",
            createdAt: new Date().toISOString()
        };

        try {

            // Get existing requests
            const existingRequests = JSON.parse(
                localStorage.getItem("medicare_blood_requests") || "[]"
            );

            if (!Array.isArray(existingRequests)) {
                throw new Error("Invalid saved request data");
            }

            // Add new request
            existingRequests.push(request);

            // Save all requests
            localStorage.setItem(
                "medicare_blood_requests",
                JSON.stringify(existingRequests)
            );

            // Show success message
            const message = document.getElementById("message");

            message.style.color = "green";

            message.textContent =
                "Blood request submitted successfully! " +
                "Your request is pending admin approval.";

            // Reset form
            form.reset();

            dateInput.value = todayString;

        } catch (error) {

            const message = document.getElementById("message");

            message.style.color = "red";

            message.textContent =
                "Unable to save request. Please try again.";

            console.error(error);
        }

    });

</script>

</body>
</html>
