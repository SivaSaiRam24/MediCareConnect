
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Appointments | MediCare Connect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #333;
        }

        header {
            background: #087f8c;
            color: white;
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #06636d;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000010;
        }

        .stat-card h3 {
            font-size: 16px;
            color: #666;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            color: #087f8c;
            margin-top: 12px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 3px 10px #00000010;
        }

        .filters {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #087f8c;
            color: white;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
            color: white;
        }

        .approve {
            background: #16803c;
        }

        .cancel {
            background: #d93636;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>🏥 MediCare Connect</h2>
    <a href="admin-dashboard.html">← Back to Dashboard</a>
</header>

<div class="container">

    <h1>📅 Appointments Management</h1>
    <p>View and manage all patient appointments.</p>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Appointments</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Confirmed</h3>
            <p id="confirmedCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Cancelled</h3>
            <p id="cancelledCount">0</p>
        </div>

    </div>

    <div class="table-container">

        <h2>All Bookings</h2>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search patient name or email..."
                oninput="loadAppointments()"
            >

            <select id="statusFilter" onchange="loadAppointments()">
                <option value="All">All Appointments</option>
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Cancelled">Cancelled</option>
            </select>

        </div>

        <table>
            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="appointmentsTable"></tbody>
        </table>

    </div>
</div>


<script src="auth.js"></script>

<script>
    // Admin dashboard protection
    const adminSession = protectDashboard("admin");

    function getAppointments() {
        return JSON.parse(
            localStorage.getItem("medicare_appointments") || "[]"
        );
    }

    function loadAppointments() {

        const appointments = getAppointments();

        // Update appointment counts
        document.getElementById("totalCount").textContent =
            appointments.length;

        document.getElementById("pendingCount").textContent =
            appointments.filter(a => a.status === "Pending").length;

        document.getElementById("confirmedCount").textContent =
            appointments.filter(a => a.status === "Confirmed").length;

        document.getElementById("cancelledCount").textContent =
            appointments.filter(a => a.status === "Cancelled").length;

        const filter =
            document.getElementById("statusFilter").value;

        const search =
            document.getElementById("searchInput")
            .value.toLowerCase();

        const filtered = appointments.filter(a => {

            const matchesStatus =
                filter === "All" || a.status === filter;

            const matchesSearch =
                (a.patientName || "").toLowerCase().includes(search) ||
                (a.patientEmail || "").toLowerCase().includes(search);

            return matchesStatus && matchesSearch;
        });

        const tbody =
            document.getElementById("appointmentsTable");

        tbody.innerHTML = "";

        if (filtered.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="empty">
                        No appointments found.
                    </td>
                </tr>
            `;
            return;
        }

        filtered.forEach(a => {

            const row = document.createElement("tr");

            function addCell(value) {
                const td = document.createElement("td");
                td.textContent = value || "N/A";
                row.appendChild(td);
            }

            addCell(a.patientName);
            addCell(a.patientEmail);
            addCell(a.patientPhone);
            addCell(a.doctor);
            addCell(a.date);
            addCell(a.time);
            addCell(a.reason);
            addCell(a.status);

            // ACTIONS COLUMN
            const action = document.createElement("td");

            // STEP 3: DELETE BUTTON
            const deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Delete";
            deleteBtn.style.background = "#dc3545";
            deleteBtn.style.color = "white";
            deleteBtn.style.padding = "8px 12px";
            deleteBtn.style.border = "none";
            deleteBtn.style.borderRadius = "5px";
            deleteBtn.style.cursor = "pointer";

            deleteBtn.onclick = function() {
                deleteAppointment(a.id);
            };

            action.appendChild(deleteBtn);

            // Approve and Cancel buttons
            if (a.status === "Pending") {

                const approve = document.createElement("button");
                approve.textContent = "Approve";
                approve.className = "approve";

                approve.onclick = () => {
                    updateStatus(a.id, "Confirmed");
                };

                const cancel = document.createElement("button");
                cancel.textContent = "Cancel";
                cancel.className = "cancel";

                cancel.onclick = () => {
                    updateStatus(a.id, "Cancelled");
                };

                action.append(approve, cancel);
            }

            row.appendChild(action);
            tbody.appendChild(row);
        });
    }

    // Update appointment status
    function updateStatus(id, status) {

        let appointments = getAppointments();

        appointments = appointments.map(a => {
            if (String(a.id) === String(id)) {
                return { ...a, status: status };
            }
            return a;
        });

        localStorage.setItem(
            "medicare_appointments",
            JSON.stringify(appointments)
        );

        loadAppointments();
    }

    // DELETE APPOINTMENT FUNCTION
    function deleteAppointment(id) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this appointment?"
        );

        if (!confirmDelete) {
            return;
        }

        let appointments = getAppointments();

        appointments = appointments.filter(
            appointment =>
                String(appointment.id) !== String(id)
        );

        localStorage.setItem(
            "medicare_appointments",
            JSON.stringify(appointments)
        );

        alert("Appointment deleted successfully!");

        // Refresh table and counts
        loadAppointments();
    }

    // Load appointments only after admin check
    if (adminSession) {
        loadAppointments();
    }
</script>


</body>
</html>
